# ===== JPA 모드 =====
# 실행: mvn spring-boot:run -Dspring-boot.run.profiles=jpa
spring:
  autoconfigure:
    exclude:
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: none          # 테이블은 schema.sql 이 만든다 (JPA/MyBatis 공통 스키마)
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('상표 데이터 관리')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
    <div th:replace="~{fragments :: alerts}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="mb-0">상표 데이터 관리</h1>
        <form th:action="@{/admin/trademarks/reindex-all}" method="post"
              onsubmit="return confirm('모든 상표의 특징 벡터를 현재 AI 모델로 다시 추출합니다. 계속할까요?')">
            <button class="btn btn-warning">전체 벡터 재추출</button>
        </form>
    </div>
    <p class="text-muted small">현재 AI 모델: <b th:text="${currentModel} ?: '연결 안 됨'"></b>
        · 모델이 바뀌면 이전 모델의 벡터는 검색 대상에서 빠지므로 재추출이 필요합니다.</p>

    <form class="row g-2 mb-3" th:action="@{/admin/trademarks}" method="get">
        <div class="col-md-5"><input name="keyword" class="form-control" th:value="${keyword}" placeholder="검색어"></div>
        <div class="col-auto"><button class="btn btn-outline-secondary">검색</button></div>
    </form>

    <table class="table table-hover bg-white align-middle">
        <thead><tr><th>ID</th><th></th><th>출원번호</th><th>상표명</th><th>출원인</th><th>류</th>
            <th>벡터 모델</th><th>등록일</th><th></th></tr></thead>
        <tbody>
        <tr th:each="t : ${result.content()}">
            <td th:text="${t.id}"></td>
            <td><img class="thumb-sm" th:src="@{'/uploads/' + ${t.imagePath}}" alt=""></td>
            <td th:text="${t.applicationNo}"></td>
            <td><a th:href="@{/trademarks/{id}(id=${t.id})}" th:text="${t.name}"></a></td>
            <td th:text="${t.applicant}"></td>
            <td th:text="${t.niceClass}"></td>
            <td>
                <span th:if="${t.hasVector()}" th:text="${t.modelName}"
                      th:classappend="${t.modelName != currentModel} ? 'text-danger'"></span>
                <span th:unless="${t.hasVector()}" class="badge bg-warning text-dark">없음</span>
            </td>
            <td th:text="${#temporals.format(t.createdAt, 'yyyy-MM-dd')}"></td>
            <td class="text-nowrap">
                <form class="d-inline" th:action="@{/admin/trademarks/{id}/reindex(id=${t.id})}" method="post">
                    <button class="btn btn-sm btn-outline-primary">재추출</button>
                </form>
                <form class="d-inline" th:action="@{/admin/trademarks/{id}/delete(id=${t.id})}" method="post"
                      onsubmit="return confirm('삭제하시겠습니까?')">
                    <button class="btn btn-sm btn-outline-danger">삭제</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <div th:replace="~{fragments :: pagination(${result}, '/admin/trademarks')}"></div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>

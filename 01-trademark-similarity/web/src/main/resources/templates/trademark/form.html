<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${mode == 'create' ? '상표 등록' : '상표 수정'})}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container" style="max-width: 760px">
    <h1 class="mb-3" th:text="${mode == 'create'} ? '상표 등록' : '상표 수정'">상표 등록</h1>

    <form class="card p-4" method="post" enctype="multipart/form-data" th:object="${form}"
          th:action="${mode == 'create'} ? @{/trademarks/new} : @{/trademarks/{id}/edit(id=${trademark.id})}">

        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">출원번호 *</label>
                <input type="text" class="form-control" th:field="*{applicationNo}"
                       th:classappend="${#fields.hasErrors('applicationNo')} ? 'is-invalid'"
                       placeholder="40-2026-0001234">
                <div class="invalid-feedback" th:errors="*{applicationNo}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label">상표명 *</label>
                <input type="text" class="form-control" th:field="*{name}"
                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{name}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label">출원인</label>
                <input type="text" class="form-control" th:field="*{applicant}">
            </div>
            <div class="col-md-6">
                <label class="form-label">니스 상품분류 (1~45류)</label>
                <input type="number" min="1" max="45" class="form-control" th:field="*{niceClass}"
                       th:classappend="${#fields.hasErrors('niceClass')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{niceClass}"></div>
            </div>
            <div class="col-12">
                <label class="form-label">설명</label>
                <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
            </div>
            <div class="col-12">
                <label class="form-label">
                    상표 이미지 <span th:text="${mode == 'create'} ? '*' : '(변경 시에만 선택)'"></span>
                </label>
                <div th:if="${mode == 'edit'}" class="mb-2">
                    <img class="thumb-sm" th:src="@{'/uploads/' + ${trademark.imagePath}}" alt="현재 이미지">
                    <span class="small text-muted ms-2">현재 이미지</span>
                </div>
                <input type="file" name="image" accept="image/*" class="form-control"
                       th:classappend="${imageError} ? 'is-invalid'" onchange="previewImage(this)">
                <div class="invalid-feedback" th:text="${imageError}"></div>
                <img id="preview" class="mt-2 d-none" alt="미리보기">
            </div>
        </div>

        <div class="mt-4 d-flex gap-2">
            <button class="btn btn-primary" th:text="${mode == 'create'} ? '등록' : '저장'">등록</button>
            <a class="btn btn-outline-secondary" th:href="@{/trademarks}">취소</a>
        </div>
        <p class="small text-muted mt-3 mb-0">저장할 때 AI 서버가 이미지 특징 벡터를 자동으로 생성합니다.</p>
    </form>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
<script>
    function previewImage(input) {
        const img = document.getElementById('preview');
        if (input.files && input.files[0]) {
            img.src = URL.createObjectURL(input.files[0]);
            img.classList.remove('d-none');
        }
    }
</script>
</body>
</html>

# ===== MyBatis 모드 =====
# 실행: mvn spring-boot:run -Dspring-boot.run.profiles=mybatis
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.example.trademark.domain
  configuration:
    map-underscore-to-camel-case: true   # application_no → applicationNo
    jdbc-type-for-null: NULL

logging:
  level:
    com.example.trademark.repository.mybatis: DEBUG   # 실행 SQL 로그

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('측정소')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container" style="max-width: 680px">
    <h1 class="mb-3" th:text="${stationId == null} ? '측정소 등록' : '측정소 수정'">측정소 등록</h1>
    <form class="card p-4" th:object="${form}" method="post"
          th:action="${stationId == null} ? @{/admin/stations/new} : @{/admin/stations/{id}/edit(id=${stationId})}">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">측정소명 *</label>
                <input class="form-control" th:field="*{name}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{name}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label">시도 *</label>
                <input class="form-control" th:field="*{region}" th:errorclass="is-invalid" placeholder="서울">
                <div class="invalid-feedback" th:errors="*{region}"></div>
            </div>
            <div class="col-12">
                <label class="form-label">주소</label>
                <input class="form-control" th:field="*{address}">
            </div>
            <div class="col-md-6">
                <label class="form-label">위도</label>
                <input type="number" step="0.0001" class="form-control" th:field="*{latitude}">
            </div>
            <div class="col-md-6">
                <label class="form-label">경도</label>
                <input type="number" step="0.0001" class="form-control" th:field="*{longitude}">
            </div>
            <div class="col-md-6">
                <label class="form-label">에어코리아 측정소명</label>
                <input type="text" class="form-control" th:field="*{airkoreaName}" maxlength="50" placeholder="예: 중구"
                       th:classappend="${#fields.hasErrors('airkoreaName')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{airkoreaName}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label">기상청 ASOS 지점번호</label>
                <input type="number" class="form-control" th:field="*{kmaStnId}" min="1" max="999" placeholder="예: 108 (서울)"
                       th:classappend="${#fields.hasErrors('kmaStnId')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{kmaStnId}"></div>
                <div class="form-text">둘 다 입력한 측정소만 매일 자동 수집됩니다.</div>
            </div>
            <div class="col-12">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" th:field="*{active}">
                    <label class="form-check-label">운영 중 (대시보드에 표시)</label>
                </div>
            </div>
        </div>
        <div class="mt-4 d-flex gap-2">
            <button class="btn btn-primary">저장</button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/stations}">취소</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>

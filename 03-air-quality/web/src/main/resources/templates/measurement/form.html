<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('측정 데이터 등록')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container" style="max-width: 860px">
    <h1 class="mb-3">측정 데이터 등록 <small class="text-muted fs-6">저장하면 다음날 대기질을 자동 예측합니다</small></h1>
    <div th:if="${#fields.hasErrors('${form.*}')}" class="alert alert-danger">입력값을 확인하세요.</div>

    <form class="card p-4" th:action="@{/measurements/new}" th:object="${form}" method="post">
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label">측정소 *</label>
                <select class="form-select" th:field="*{stationId}"
                        th:classappend="${#fields.hasErrors('stationId')} ? 'is-invalid'">
                    <option value="">선택</option>
                    <option th:each="s : ${stations}" th:value="${s.id}" th:text="|${s.region} ${s.name}|"></option>
                </select>
                <div class="invalid-feedback" th:errors="*{stationId}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label">측정일 *</label>
                <input type="date" class="form-control" th:field="*{measureDate}"
                       th:classappend="${#fields.hasErrors('measureDate')} ? 'is-invalid'">
                <div class="form-text">같은 측정소·날짜가 이미 있으면 값을 덮어쓰고 다시 예측합니다.</div>
            </div>
        </div>

        <h6 class="text-primary">대기오염 (일평균)</h6>
        <div class="row g-3 mb-3">
            <div class="col-md-2"><label class="form-label">PM10 ㎍/㎥</label>
                <input type="number" step="0.1" class="form-control" th:field="*{pm10}" th:errorclass="is-invalid"></div>
            <div class="col-md-2"><label class="form-label">PM2.5 ㎍/㎥</label>
                <input type="number" step="0.1" class="form-control" th:field="*{pm25}" th:errorclass="is-invalid"></div>
            <div class="col-md-2"><label class="form-label">O₃ ppm</label>
                <input type="number" step="0.001" class="form-control" th:field="*{o3}" th:errorclass="is-invalid"></div>
            <div class="col-md-2"><label class="form-label">NO₂ ppm</label>
                <input type="number" step="0.001" class="form-control" th:field="*{no2}" th:errorclass="is-invalid"></div>
            <div class="col-md-2"><label class="form-label">CO ppm</label>
                <input type="number" step="0.01" class="form-control" th:field="*{co}" th:errorclass="is-invalid"></div>
            <div class="col-md-2"><label class="form-label">SO₂ ppm</label>
                <input type="number" step="0.0001" class="form-control" th:field="*{so2}" th:errorclass="is-invalid"></div>
        </div>

        <h6 class="text-primary">기상</h6>
        <div class="row g-3 mb-4">
            <div class="col-md-3"><label class="form-label">기온 ℃</label>
                <input type="number" step="0.1" class="form-control" th:field="*{temperature}" th:errorclass="is-invalid"></div>
            <div class="col-md-3"><label class="form-label">습도 %</label>
                <input type="number" step="1" class="form-control" th:field="*{humidity}" th:errorclass="is-invalid"></div>
            <div class="col-md-3"><label class="form-label">풍속 m/s</label>
                <input type="number" step="0.1" class="form-control" th:field="*{windSpeed}" th:errorclass="is-invalid"></div>
            <div class="col-md-3"><label class="form-label">강수량 mm</label>
                <input type="number" step="0.1" class="form-control" th:field="*{precipitation}" th:errorclass="is-invalid"></div>
        </div>

        <button class="btn btn-primary btn-lg">저장 및 예측</button>
    </form>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('예측 이력')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
    <h1 class="mb-3">예측 이력 <small class="text-muted fs-6" th:text="|총 ${result.total()}건|"></small></h1>

    <form class="row g-2 mb-3" th:action="@{/predictions}" method="get">
        <div class="col-md-4">
            <select name="stationId" class="form-select">
                <option value="">전체 측정소</option>
                <option th:each="s : ${stations}" th:value="${s.id}" th:text="${s.name}"
                        th:selected="${s.id == stationId}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <select name="grade" class="form-select">
                <option value="">전체 등급</option>
                <option value="1" th:selected="${grade == 1}">좋음</option>
                <option value="2" th:selected="${grade == 2}">보통</option>
                <option value="3" th:selected="${grade == 3}">나쁨</option>
                <option value="4" th:selected="${grade == 4}">매우나쁨</option>
            </select>
        </div>
        <div class="col-auto"><button class="btn btn-outline-secondary">조회</button></div>
    </form>

    <table class="table table-hover bg-white align-middle">
        <thead><tr><th>예측 대상일</th><th>측정소</th><th>예측 PM10</th><th>예측 PM2.5</th><th>통합 등급</th>
            <th>모델</th><th>예측일시</th></tr></thead>
        <tbody>
        <tr th:each="p : ${result.content()}">
            <td th:text="${p.targetDate}"></td>
            <td><a th:href="@{/stations/{id}(id=${p.stationId})}" th:text="${stationNames[p.stationId]}"></a></td>
            <td th:text="${#numbers.formatDecimal(p.predPm10, 1, 1)}"></td>
            <td th:text="${#numbers.formatDecimal(p.predPm25, 1, 1)}"></td>
            <td><span th:replace="~{fragments :: badge(${p.color()}, ${p.gradeLabel})}"></span></td>
            <td class="small text-muted" th:text="${p.modelVersion}"></td>
            <td class="small" th:text="${#temporals.format(p.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
        <tr th:if="${result.content().isEmpty()}"><td colspan="7" class="text-muted">예측 이력이 없습니다.</td></tr>
        </tbody>
    </table>
    <div th:replace="~{fragments :: pagination(${result}, '/predictions')}"></div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>

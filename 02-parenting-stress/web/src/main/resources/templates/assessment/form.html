<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('설문 등록')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container"><div class="narrow" style="max-width: 860px">
    <h1 class="mb-3">설문 등록 및 스트레스 수준 예측</h1>
    <div th:if="${#fields.hasErrors('${form.*}')}" class="alert alert-danger">입력값을 확인하세요.</div>

    <form class="card p-4" th:action="@{/assessments/new}" th:object="${form}" method="post">
        <h6 class="text-primary">대상자</h6>
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <label class="form-label">대상자 코드(가명) *</label>
                <input class="form-control" th:field="*{respondentCode}" placeholder="P-0001"
                       th:classappend="${#fields.hasErrors('respondentCode')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{respondentCode}"></div>
                <div class="form-text">실명 대신 코드를 사용하세요.</div>
            </div>
            <div class="col-md-4">
                <label class="form-label">부모 나이 *</label>
                <input type="number" step="1" class="form-control" th:field="*{parentAge}" min="18" max="70"
                       th:classappend="${#fields.hasErrors('parentAge')} ? 'is-invalid'">
            </div>
        </div>

        <h6 class="text-primary">가구·생활 시간</h6>
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <label class="form-label">자녀 수</label>
                <input type="number" step="1" class="form-control" th:field="*{childCount}" min="1" max="6"
                       th:classappend="${#fields.hasErrors('childCount')} ? 'is-invalid'">
            </div>
            <div class="col-md-3">
                <label class="form-label">막내 자녀 나이</label>
                <input type="number" step="1" class="form-control" th:field="*{youngestChildAge}" min="0" max="18"
                       th:classappend="${#fields.hasErrors('youngestChildAge')} ? 'is-invalid'">
            </div>
            <div class="col-md-3">
                <label class="form-label">주당 근로시간</label>
                <input type="number" step="1" class="form-control" th:field="*{weeklyWorkHours}" min="0" max="80"
                       th:classappend="${#fields.hasErrors('weeklyWorkHours')} ? 'is-invalid'">
            </div>
            <div class="col-md-3">
                <label class="form-label">하루 수면시간</label>
                <input type="number" step="0.1" class="form-control" th:field="*{sleepHours}" min="3" max="10"
                       th:classappend="${#fields.hasErrors('sleepHours')} ? 'is-invalid'">
            </div>
        </div>

        <h6 class="text-primary">심리·사회 척도 (0 낮음 ~ 100 높음, 척도 검사 환산 점수)</h6>
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <label class="form-label">양육 효능감: <b id="v1" th:text="*{parentingEfficacy}"></b></label>
                <input type="range" class="form-range" th:field="*{parentingEfficacy}" min="0" max="100"
                       oninput="v1.textContent=this.value">
            </div>
            <div class="col-md-4">
                <label class="form-label">사회적 지지: <b id="v2" th:text="*{socialSupport}"></b></label>
                <input type="range" class="form-range" th:field="*{socialSupport}" min="0" max="100"
                       oninput="v2.textContent=this.value">
            </div>
            <div class="col-md-4">
                <label class="form-label">가족 환경: <b id="v3" th:text="*{familyEnvironment}"></b></label>
                <input type="range" class="form-range" th:field="*{familyEnvironment}" min="0" max="100"
                       oninput="v3.textContent=this.value">
            </div>
            <div class="col-md-4">
                <label class="form-label">회복탄력성: <b id="v4" th:text="*{resilience}"></b></label>
                <input type="range" class="form-range" th:field="*{resilience}" min="0" max="100"
                       oninput="v4.textContent=this.value">
            </div>
            <div class="col-md-4">
                <label class="form-label">삶의 질: <b id="v5" th:text="*{qualityOfLife}"></b></label>
                <input type="range" class="form-range" th:field="*{qualityOfLife}" min="0" max="100"
                       oninput="v5.textContent=this.value">
            </div>
        </div>

        <label class="form-label">상담 메모</label>
        <textarea class="form-control mb-4" rows="2" th:field="*{memo}"></textarea>

        <button class="btn btn-primary btn-lg">AI 예측 실행</button>
    </form>
</div></main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>

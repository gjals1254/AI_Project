<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('로그인')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container"><div class="narrow" style="max-width: 420px">
    <div class="card p-4">
        <h1 class="mb-3">로그인</h1>
        <div th:if="${param.error}" class="alert alert-danger">아이디 또는 비밀번호가 올바르지 않습니다.</div>
        <div th:if="${param.logout}" class="alert alert-info">로그아웃되었습니다.</div>
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">아이디</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">비밀번호</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button class="btn btn-primary w-100">로그인</button>
        </form>
        <p class="small text-muted mt-3 mb-0">기본 계정: admin / admin1234 (관리자), counselor / counselor1234 (상담자)</p>
    </div>
</div></main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
